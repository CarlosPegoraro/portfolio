        <path d="M151 287 C134 292 126 305 131 319 C112 322 103 336 109 350"/>
        <path d="M230 300 C215 309 214 325 224 336 C213 346 214 361 225 369"/>
        <path d="M165 118 C153 127 153 141 163 149 C149 159 149 172 159 181"/>
        <path d="M103 219 C91 228 92 241 103 249"/>
