<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" role="img" aria-labelledby="title desc">
    <title id="title">Cérebro neon dividido entre análise e código</title>
    <desc id="desc">Ilustração vetorial de um cérebro em duas metades, roxa à esquerda e ciano à direita, com símbolo de
        código.
    </desc>
    <defs>
        <linearGradient id="leftStroke" x1="70" y1="70" x2="255" y2="380" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#28dfea"/>
            <stop offset="0.55" stop-color="#00d9e8"/>
            <stop offset="1" stop-color="#20b7ff"/>
        </linearGradient>
        <linearGradient id="rightStroke" x1="265" y1="70" x2="455" y2="380" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#28d9ff"/>
            <stop offset="0.55" stop-color="#00d9e8"/>
            <stop offset="1" stop-color="#20b7ff"/>
        </linearGradient>
        <filter id="glowPurple" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="7" result="blur"/>
            <feFlood flood-color="#a84cff" flood-opacity="0.9"/>
            <feComposite in2="blur" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="7" result="blur"/>
            <feFlood flood-color="#00eaff" flood-opacity="0.95"/>
            <feComposite in2="blur" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <clipPath id="leftClip">
            <rect x="55" y="34" width="202" height="362" rx="24"/>
        </clipPath>
        <clipPath id="rightClip">
            <rect x="263" y="34" width="202" height="362" rx="24"/>
        </clipPath>
    </defs>

    <!-- left outer lobe -->
    <g fill="none" stroke="url(#leftStroke)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M253 62
             C236 45 208 48 195 65
             C170 57 149 70 143 92
             C119 94 102 111 102 133
             C78 142 69 162 76 182
             C55 198 54 224 67 241
             C54 265 64 289 84 302
             C79 328 96 348 119 351
             C129 374 153 385 174 376
             C192 395 225 391 240 369
             C250 358 254 339 254 318 Z"/>
        <path d="M252 66 L252 363" opacity="0.9"/>
    </g>

    <!-- right outer lobe -->
    <g fill="none" stroke="url(#rightStroke)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
       filter="url(#glowCyan)">
        <path d="M267 62
             C284 45 312 48 325 65
             C350 57 371 70 377 92
             C401 94 418 111 418 133
             C442 142 451 162 444 182
             C465 198 466 224 453 241
             C466 265 456 289 436 302
             C441 328 424 348 401 351
             C391 374 367 385 346 376
             C328 395 295 391 280 369
             C270 358 266 339 266 318 Z"/>
        <path d="M268 66 L268 363" opacity="0.9"/>
    </g>

